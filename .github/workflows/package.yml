# Builds the package as PyPI will get it, and checks it: twine's checks of
# its metadata and README, that the wheel holds only dasha (no tests,
# example applications or build scripts), and that it installs and runs in
# a clean environment. Fails (a non-zero exit) if any
# of that goes wrong.
name: Package

on:
  pull_request:
    # "edited" covers a pull request moved onto the default branch.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: build and check
    # Pull requests into the default branch only, whatever it is called.
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Build
        run: |
          python -m pip install build twine
          python -m build
      - name: twine check
        run: python -m twine check --strict dist/*
      - name: Only dasha in the wheel
        run: |
          python - <<'EOF'
          import glob, zipfile
          (wheel,) = glob.glob("dist/*.whl")
          tops = {name.split("/")[0] for name in zipfile.ZipFile(wheel).namelist()}
          extra = {top for top in tops if top != "dasha"}
          extra = {top for top in extra if not top.endswith(".dist-info")}
          print("top level:", sorted(tops))
          if extra:
              raise SystemExit(f"unexpected in the wheel: {sorted(extra)}")
          EOF
      - name: Installs and runs
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/python -m pip install dist/*.whl
          /tmp/clean/bin/dasha --version
          /tmp/clean/bin/dasha-desktop --version
