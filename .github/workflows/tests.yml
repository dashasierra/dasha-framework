# Runs Dasha Framework's own tests (tests/) on Linux, Windows and macOS, with the
# oldest Python it supports and the newest, measuring coverage as they run.
# Any failing test fails the check, and so does coverage below the floor.
name: Tests

on:
  pull_request:
    # "edited" covers a pull request moved onto the default branch.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unittest:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    # Pull requests into the default branch only, whatever it is called.
    if: github.base_ref == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e . "coverage>=7.10"
      - name: unittest, measuring coverage
        # Settings in pyproject.toml ([tool.coverage.*]): dasha
        # only, and the application processes the tests start too.
        run: python -m coverage run -m unittest discover -s tests -v
      - name: Coverage
        # The floor sits a little under what the tests reach today (about
        # 92% on Linux, 94% on Windows), so a real drop fails the check.
        run: |
          python -m coverage combine
          python -m coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
          python -m coverage report --fail-under=90
