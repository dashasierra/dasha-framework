# Type-checks Dasha Framework, its tests and the example applications with mypy
# (strict), on Linux, Windows and macOS: mypy only checks the code for the system
# it runs on. Any error fails the check.
name: Type check

on:
  pull_request:
    # "edited" covers a pull request moved onto the default branch.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mypy:
    name: mypy (${{ matrix.os }})
    # Pull requests into the default branch only, whatever it is called.
    if: github.base_ref == github.event.repository.default_branch
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: mypy (Dasha Framework and its tests)
        # What to check and how come from pyproject.toml.
        run: python -m mypy
      - name: mypy (example applications)
        working-directory: apps
        run: python -m mypy --strict .
