# Builds the documentation as Read the Docs does, with every Sphinx warning
# an error (a broken docstring, link or reference), so a pull request that
# would break the published site fails here first.
name: Docs

on:
  pull_request:
    # "edited" covers a pull request moved onto the default branch.
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  sphinx:
    name: sphinx
    # Pull requests into the default branch only, whatever it is called.
    if: github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[docs]"
      - name: sphinx
        run: python -m sphinx -W --keep-going -b html docs docs/_build/html
